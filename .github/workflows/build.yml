name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      # The runner ships rustup; no third-party actions needed.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/isla.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  isla.exe" | Out-File -Encoding ascii target/release/isla.exe.sha256
          Get-Content target/release/isla.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: isla
          path: |
            target/release/isla.exe
            target/release/isla.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/isla.exe target/release/isla.exe.sha256 --generate-notes
