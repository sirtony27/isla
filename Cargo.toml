[package]
name = "isla"
version = "0.3.0"
edition = "2021"
description = "A tiny native notch for Windows: now playing, volume, water, focus timer and system alerts."
license = "MIT"
readme = "README.md"
keywords = ["windows", "notch", "dynamic-island", "media", "widget"]
categories = ["gui"]

# Only the official windows-rs crates: `windows` plus its own sub-crates whose
# types appear in its signatures (async operations, D2D vectors) or that its
# `#[implement]` macro expects by name (COM callbacks from Core Audio).
[dependencies]
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
